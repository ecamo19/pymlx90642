[workspace]
authors = ["Craig Barton","ecamo19 <erickcamo19@gmail.com>"]
channels = ["conda-forge"]
description = 'Python code for communicate with the Melexis mlx90642 thermal sensor'
name = "pymlx90642"
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
ruff = ">=0.12.9,<0.13"
nbdev = ">=2.4.5,<3"
quarto = ">=1.7.33,<2"
python = ">=3.10"
jupyterlab = ">=4.4.6,<5"
fastcore = ">=1.8.7,<2"
ipykernel = ">=6.30.1,<7"
pip = ">=25.2,<26"
numpy = ">=2.3.2,<3"
pydantic = ">=2.11.7,<3"
matplotlib = ">=3.10.5,<4"
pillow = ">=11.3.0,<12"

[tasks]

[pypi-dependencies]
jupyterlab-quarto = ">=0.3.5, <0.4"
smbus = ">=1.1.post2, <2"
